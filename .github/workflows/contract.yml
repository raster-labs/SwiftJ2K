name: Milestone 1 contract

# Contract 0.5.0 PLAT-01: Swift 6.2 is the manifest minimum and Apple OS 26.0 is
# the deployment floor across macOS, iOS, tvOS, visionOS and watchOS.
#
# Owner CI scope directive (2 November 2026): feature-branch/PR CI is scoped to
# macOS and iOS ONLY. Linux is OUT_OF_CURRENT_SCOPE_BY_OWNER (preserving prior
# failed Linux receipts as historical evidence; no new Linux gates are run here).
# Toolchain/runtime disclosure: GitHub's `macos-26` runner ships Xcode 26.6
# (`Apple Swift version 6.3.3`); standalone Swift 6.2 and 6.4 Linux container
# runtime execution is not performed under this Apple-only CI scope while
# `Package.swift` preserves the `swift-tools-version: 6.2` manifest floor and
# `.macOS(.v26), .iOS(.v26), .tvOS(.v26), .visionOS(.v26), .watchOS(.v26)` minima.
#
# Five direct external interoperability checks (combined Part 10+15; native 3D
# JPIP; exact repository WebSocket extension; direct full-38-bit Part 2
# synthesis/output; multiple transmitted nonempty HT sets) are ON_HOLD_BY_OWNER /
# DEFERRED / UNEXECUTED per Owner Update 15 (2 November 2026); the five
# `@Test(.enabled(if: ...))` external-oracle declarations (`ojph_expand`,
# `kdu_expand`, `opj_decompress`) remain UNEXECUTED when external CLI binaries
# are absent on hosted runners.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-identity:
    name: Shared contract byte-identity
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # POL-03 requires the seven shared documents to stay byte-identical across
      # all four repositories. Checking the recorded manifest here catches local
      # drift immediately; cross-repository comparison belongs to the suite
      # harness, which cannot run from inside one repository.
      - name: Verify COMMON_CONTRACT_SHA256.txt matches the documents
        working-directory: Documentation
        run: shasum -a 256 -c COMMON_CONTRACT_SHA256.txt

  macos:
    # GitHub's `macos-26` image ships Xcode 26.6 (`Apple Swift version 6.3.3`).
    # Five external-oracle declarations (`ojph_expand`, `kdu_expand`,
    # `opj_decompress`) use @Test(.enabled(if: ...)) when tools are unavailable.
    # Their explicit skips remain unexecuted oracle checks, not passing evidence.
    name: macOS 26 / Xcode 26.6 (Swift 6.3.3)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      - run: swift build
      - name: Ordinary tests
        id: ordinary_tests
        run: |
          set -euo pipefail
          mkdir -p .build/sanitizer-evidence/ordinary
          swift test --xunit-output .build/sanitizer-evidence/ordinary/full.xml
      # Keep the ordinary full-suite run above. Each sanitizer still executes
      # every test; only JPIP and its exact complement run in separate processes.
      - name: Address sanitizer
        id: address_tests
        run: |
          set -euo pipefail
          python3 Scripts/verify-sanitizer-inventory.py --sanitizer address --scratch-path .build/asan --output .build/sanitizer-evidence/address
          swift test --scratch-path .build/asan --sanitize address --skip-build --filter '^SwiftJ2KJPIPTests[./]' --xunit-output .build/sanitizer-evidence/address/jpip.xml
          swift test --scratch-path .build/asan --sanitize address --skip-build --skip '^SwiftJ2KJPIPTests[./]' --xunit-output .build/sanitizer-evidence/address/complement.xml
      - name: Thread sanitizer
        id: thread_tests
        run: |
          set -euo pipefail
          python3 Scripts/verify-sanitizer-inventory.py --sanitizer thread --scratch-path .build/tsan --output .build/sanitizer-evidence/thread
          swift test --scratch-path .build/tsan --sanitize thread --skip-build --filter '^SwiftJ2KJPIPTests[./]' --xunit-output .build/sanitizer-evidence/thread/jpip.xml
          swift test --scratch-path .build/tsan --sanitize thread --skip-build --skip '^SwiftJ2KJPIPTests[./]' --xunit-output .build/sanitizer-evidence/thread/complement.xml

      - name: Retain exact test evidence in downloadable logs
        if: always()
        env:
          EVIDENCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_ORDINARY: ${{ steps.ordinary_tests.outcome }}
          EVIDENCE_ASAN: ${{ steps.address_tests.outcome }}
          EVIDENCE_TSAN: ${{ steps.thread_tests.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY_EVIDENCE'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path

          FORMAT = "swiftj2k-ci-evidence-v1"
          ROOT = Path(".build/sanitizer-evidence")
          MAX_FILE = 8 * 1024 * 1024
          MAX_TOTAL = 16 * 1024 * 1024
          CHARS_PER_CHUNK = 4096
          problems = []
          retained = set()
          total = 0

          def emit(kind, **fields):
              print(json.dumps({"format": FORMAT, "kind": kind, **fields},
                               ensure_ascii=True, separators=(",", ":")), flush=True)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          try:
              head, tree = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}")
              clean = subprocess.run(["git", "diff", "--quiet", "HEAD", "--"], check=False).returncode == 0
              identity = {name: os.environ.get(name) for name in (
                  "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
                  "GITHUB_EVENT_NAME", "GITHUB_REF", "GITHUB_SHA", "EVIDENCE_PR_HEAD",
                  "EVIDENCE_PR_BASE", "EVIDENCE_ORDINARY", "EVIDENCE_ASAN", "EVIDENCE_TSAN")}
              emit("begin", identity=identity, checkout_head=head, checkout_tree=tree,
                   tracked_tree_clean=clean, max_file_bytes=MAX_FILE, max_total_bytes=MAX_TOTAL)
              if not clean or head != os.environ.get("GITHUB_SHA"):
                  problems.append("Checkout identity differs from the workflow SHA or tracked files changed")
          except (OSError, subprocess.CalledProcessError) as error:
              emit("identity_error", error=str(error))
              problems.append("Checkout identity unavailable")

          inventory_names = ["reference.stdout", "reference.stderr", "reference.command-result.json",
                             "sanitized.stdout", "sanitized.stderr", "sanitized.command-result.json",
                             "inventory.json", "all.ids", "jpip.ids", "complement.ids"]
          xml_groups = [["ordinary/full.xml", "ordinary/full-swift-testing.xml"]]
          required = []
          optional = []
          for mode in ("address", "thread"):
              required += [f"{mode}/{name}" for name in inventory_names]
              optional.append(f"{mode}/inventory-mismatch.json")
              for part in ("jpip", "complement"):
                  xml_groups.append([f"{mode}/{part}.xml", f"{mode}/{part}-swift-testing.xml"])
          paths = sorted(set(required + optional + [path for group in xml_groups for path in group]))
          for relative in paths:
              path = ROOT / relative
              try:
                  # The fixed allowlist cannot disclose arbitrary files under .build. Reject
                  # symlinked ancestors and files instead of following them outside the tree.
                  if any(parent.is_symlink() for parent in [path, *path.parents]):
                      raise ValueError("Symlinked evidence path refused")
                  if not path.exists():
                      emit("missing", path=relative)
                      continue
                  info = path.stat()
                  if not stat.S_ISREG(info.st_mode):
                      raise ValueError("Evidence path is not a regular file")
                  if info.st_size > MAX_FILE or total + info.st_size > MAX_TOTAL:
                      raise ValueError("Evidence size limit exceeded; no silent truncation")
                  data = path.read_bytes()
                  if len(data) > MAX_FILE or total + len(data) > MAX_TOTAL:
                      raise ValueError("Evidence grew past the size limit")
                  content = data.decode("utf-8")  # Strict: malformed UTF-8 is not rewritten.
                  chunks = [content[i:i + CHARS_PER_CHUNK] for i in range(0, len(content), CHARS_PER_CHUNK)]
                  emit("file", path=relative, sha256=hashlib.sha256(data).hexdigest(),
                       bytes=len(data), encoding="utf-8", chunks=len(chunks))
                  for index, chunk in enumerate(chunks):
                      emit("chunk", path=relative, index=index, content_utf8=chunk)
                  retained.add(relative)
                  total += len(data)
              except (OSError, UnicodeError, ValueError) as error:
                  emit("file_error", path=relative, error=str(error))
                  problems.append(relative + ": evidence could not be retained")

          for relative in required:
              if relative not in retained:
                  problems.append("Missing inventory evidence: " + relative)
          for group in xml_groups:
              if not any(relative in retained for relative in group):
                  problems.append("No XML retained for invocation: " + group[0])
          emit("end", files=len(retained), bytes=total, problems=problems,
               retention_complete=not problems,
               scope="Retention only; missing framework reports are not zero tests; reconcile runtime declarations and parameter cases separately")
          raise SystemExit(1 if problems else 0)
          PY_EVIDENCE

  ios-simulator:
    # Actual iOS Simulator build and test execution for supported library targets
    # (`SwiftJ2K`, `SwiftJ2K3D`, `SwiftJ2KJPIP`) and test targets (`SwiftJ2KTests`,
    # `SwiftJ2K3DTests`, `SwiftJ2KJPIPTests`). The 10 macOS-only CLI subprocess test
    # declarations (`Foundation.Process`) are explicitly identified as inapplicable on
    # iOS (`#if os(macOS) || os(Linux)`), never counted as iOS passes or skips.
    name: iOS Simulator 26 / Xcode 26.6 (Swift 6.3.3)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      - name: Select iOS Simulator destination
        id: select_simulator
        run: |
          set -euo pipefail
          mkdir -p .build/ios-evidence
          python3 - <<'PY_SIM'
          import json, os, subprocess

          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if not dev.get("isAvailable", False):
                      continue
                  name = dev.get("name", "")
                  udid = dev.get("udid", "")
                  if udid:
                      score = (1 if "iPhone" in name else 0, runtime, name)
                      candidates.append((score, runtime, name, udid))
          if not candidates:
              raise SystemExit("No available iOS Simulator device found on runner")
          candidates.sort(reverse=True)
          _, runtime, name, udid = candidates[0]
          selection = {"runtime": runtime, "name": name, "udid": udid}
          with open(".build/ios-evidence/simulator.json", "w", encoding="utf-8") as f:
              json.dump(selection, f, indent=2)
              f.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"udid={udid}\n")
              out.write(f"name={name}\n")
              out.write(f"runtime={runtime}\n")
          print(json.dumps(selection, indent=2))
          PY_SIM
      - name: Build supported library and test targets for iOS Simulator
        id: ios_build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -scheme SwiftJ2K-Package \
            -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
            -derivedDataPath .build/ios-derived-data \
            -clonedSourcePackagesDirPath .build/ios-source-packages \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .build/ios-evidence/xcodebuild-build.log
          rm -rf .swiftpm
      - name: Execute iOS Simulator tests
        id: ios_tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -scheme SwiftJ2K-Package \
            -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
            -derivedDataPath .build/ios-derived-data \
            -clonedSourcePackagesDirPath .build/ios-source-packages \
            -resultBundlePath .build/ios-evidence/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .build/ios-evidence/xcodebuild-test.log
          rm -rf .swiftpm
      - name: Verify and retain iOS Simulator test inventory and evidence
        if: always()
        env:
          EVIDENCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_IOS_BUILD: ${{ steps.ios_build.outcome }}
          EVIDENCE_IOS_TESTS: ${{ steps.ios_tests.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY_IOS_EVIDENCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          FORMAT = "swiftj2k-ios-ci-evidence-v1"
          ROOT = Path(".build/ios-evidence")
          XCRES = ROOT / "ios-tests.xcresult"
          LOG = ROOT / "xcodebuild-test.log"
          problems = []

          def emit(kind, **fields):
              print(json.dumps({"format": FORMAT, "kind": kind, **fields},
                               ensure_ascii=True, separators=(",", ":")), flush=True)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          INAPPLICABLE_MACOS_ONLY_CLI_TESTS = [
              "SwiftJ2KTests.CLITestProcessSupportTests/activeBuildResolution()",
              "SwiftJ2KTests.CLITestProcessSupportTests/pipeCapacityDoesNotDeadlock()",
              "SwiftJ2KTests.CodexR3CLIHostTests/onceVerificationUsesTheAcceptedBindAddress(host:)",
              "SwiftJ2KTests.CodexR3CLIHostTests/invalidBindAddressFailsWithoutATrap()",
              "SwiftJ2KTests.CLIBreadthAndConsumerTests/cliMultiFormat16BitAndCompareMetrics()",
              "SwiftJ2KTests.CLIBreadthAndConsumerTests/cliBatch3DJPIPBenchmarkAndCompletions()",
              "SwiftJ2KTests.R1RemediationTests/cliRemediationSubprocessRegressions()",
              "SwiftJ2KTests.R2RemediationTests/normativePNGSbitReadWriteAndValidation()",
              "SwiftJ2KTests.R2RemediationTests/tiffPhotometricInterpretationSemanticsAndRejection()",
              "SwiftJ2KTests.R2RemediationTests/cliVolumeGeometryCopyPolicyAndJPIPValidation()",
          ]

          UNEXECUTED_EXTERNAL_ORACLE_TESTS = [
              "independentDecodersReadSuccessorCodestreams(name:)",
              "independentHTDecodersReadSuccessorHTJ2KCodestreams(name:)",
              "independentOraclesVerifyTranscodedOutputsInBothDirections(name:)",
              "independentOraclesDecodeSuccessorJP2JPHAndJPXContainers()",
              "independentOraclesCrossDecodePart1BreadthEncodings()",
          ]

          try:
              head, tree = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}")
              clean = subprocess.run(["git", "diff", "--quiet", "HEAD", "--"], check=False).returncode == 0
              identity = {name: os.environ.get(name) for name in (
                  "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
                  "GITHUB_EVENT_NAME", "GITHUB_REF", "GITHUB_SHA", "EVIDENCE_PR_HEAD",
                  "EVIDENCE_PR_BASE", "EVIDENCE_IOS_BUILD", "EVIDENCE_IOS_TESTS")}
              emit("begin", identity=identity, checkout_head=head, checkout_tree=tree, tracked_tree_clean=clean)
              if not clean or head != os.environ.get("GITHUB_SHA"):
                  problems.append("Checkout identity differs from workflow SHA or tracked files changed")
          except (OSError, subprocess.CalledProcessError) as error:
              emit("identity_error", error=str(error))
              problems.append("Checkout identity unavailable")

          if not XCRES.exists() or not LOG.exists():
              problems.append("Missing ios-tests.xcresult or xcodebuild-test.log")
          else:
              summary_raw = subprocess.check_output(
                  ["xcrun", "xcresulttool", "get", "test-results", "summary", "--path", str(XCRES)],
                  text=True
              )
              (ROOT / "xcresult-summary.json").write_text(summary_raw)
              summary = json.loads(summary_raw)
              log_text = LOG.read_text(encoding="utf-8", errors="replace")

              xctest_started = re.findall(r"Test Case '-\[([^\]]+)\]' started\.", log_text)
              xctest_passed = re.findall(r"Test Case '-\[([^\]]+)\]' passed \([0-9.]+ seconds\)\.", log_text)
              xctest_failed = re.findall(r"Test Case '-\[([^\]]+)\]' failed", log_text)
              st_passed_runs = re.findall(r"Test run with (\d+) tests in (\d+) suites passed after ([0-9.]+) seconds\.", log_text)
              st_failed_runs = re.findall(r"Test run with (\d+) tests in (\d+) suites failed after ([0-9.]+) seconds with (\d+) issues?\.", log_text)
              st_skips = re.findall(r"Test ([^\s]+) skipped: \"([^\"]+)\"", log_text)

              st_passed_bundle_declarations = sum(int(r[0]) for r in st_passed_runs)
              st_failed_bundle_declarations = sum(int(r[0]) for r in st_failed_runs)
              st_total_declarations = st_passed_bundle_declarations + st_failed_bundle_declarations
              st_total_suites = sum(int(r[1]) for r in st_passed_runs) + sum(int(r[1]) for r in st_failed_runs)
              st_skipped_names = sorted(s[0] for s in st_skips)
              st_passed_declarations = st_passed_bundle_declarations - len(st_skips)

              reconciliation = {
                  "xcresult_result": summary.get("result"),
                  "xcresult_total_test_count": summary.get("totalTestCount"),
                  "xcresult_passed_tests": summary.get("passedTests"),
                  "xcresult_skipped_tests": summary.get("skippedTests"),
                  "xcresult_failed_tests": summary.get("failedTests"),
                  "xctest": {
                      "started": len(xctest_started),
                      "passed": len(set(xctest_passed)),
                      "failed": len(xctest_failed),
                      "ios_only_background_transfer_tests_executed": [
                          t for t in sorted(set(xctest_passed)) if "BackgroundTransferService" in t
                      ],
                  },
                  "swift_testing": {
                      "bundle_runs": [
                          {"tests": int(r[0]), "suites": int(r[1]), "status": "passed", "seconds": float(r[2])}
                          for r in st_passed_runs
                      ] + [
                          {"tests": int(r[0]), "suites": int(r[1]), "status": "failed", "seconds": float(r[2]), "issues": int(r[3])}
                          for r in st_failed_runs
                      ],
                      "compiled_declarations_on_ios": st_total_declarations,
                      "compiled_suites_on_ios": st_total_suites,
                      "passed_bundle_declarations_on_ios": st_passed_bundle_declarations,
                      "failed_bundle_declarations_on_ios": st_failed_bundle_declarations,
                      "passed_declarations_on_ios": st_passed_declarations,
                      "skipped_external_oracle_declarations_on_ios": len(st_skips),
                      "skipped_external_oracle_names": st_skipped_names,
                  },
                  "inapplicable_macos_only_cli_process_declarations": {
                      "count": len(INAPPLICABLE_MACOS_ONLY_CLI_TESTS),
                      "counted_as_ios_pass": False,
                      "counted_as_ios_skip": False,
                      "reason": "Requires macOS Foundation.Process and swiftj2k-cli child process execution; guarded by #if os(macOS) || os(Linux)",
                      "declarations": INAPPLICABLE_MACOS_ONLY_CLI_TESTS,
                  },
                  "five_external_feature_gates_state": "ON_HOLD_BY_OWNER / DEFERRED / UNEXECUTED",
              }
              (ROOT / "ios-reconciliation.json").write_text(json.dumps(reconciliation, indent=2) + "\n")
              emit("reconciliation", **reconciliation)

              if summary.get("result") != "Passed" or summary.get("failedTests") != 0:
                  problems.append("xcresult summary did not pass with 0 failures")
              if len(set(xctest_passed)) != 1037 or len(xctest_failed) != 0:
                  problems.append(f"Expected 1037 XCTest passes and 0 failures on iOS Simulator, got {len(set(xctest_passed))} passed / {len(xctest_failed)} failed")
              if st_total_declarations != 327 or st_passed_declarations != 322 or st_failed_bundle_declarations != 0 or len(st_skips) != 5:
                  problems.append(f"Expected 327 compiled Swift Testing declarations (322 passed, 0 in failed bundles, 5 skipped), got {st_total_declarations} ({st_passed_declarations} passed, {st_failed_bundle_declarations} in failed bundles, {len(st_skips)} skipped)")
              if st_skipped_names != sorted(UNEXECUTED_EXTERNAL_ORACLE_TESTS):
                  problems.append(f"Unexpected skipped test list on iOS Simulator: {st_skipped_names}")

          for fname in ("simulator.json", "xcresult-summary.json", "ios-reconciliation.json"):
              p = ROOT / fname
              if p.exists():
                  raw_bytes = p.read_bytes()
                  emit("file", path=fname, sha256=hashlib.sha256(raw_bytes).hexdigest(),
                       bytes=len(raw_bytes), content_utf8=raw_bytes.decode("utf-8"))

          emit("end", problems=problems, verification_complete=not problems)
          raise SystemExit(1 if problems else 0)
          PY_IOS_EVIDENCE

  independent-consumer:
    name: Independent consumer resolves at tools 6.2
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: SwiftJ2K
      # POL-01/POL-02: a consumer must build against this package alone, with no
      # sibling checkout and no suite dependency, on the declared manifest floor.
      - name: Build a fresh consumer against the checkout (macOS and iOS Simulator)
        run: |
          set -eux
          NAME="$(grep -m1 -oE 'name: "Swift[A-Z0-9]+"' "$GITHUB_WORKSPACE/SwiftJ2K/Package.swift" \
                  | grep -oE 'Swift[A-Z0-9]+')"
          mkdir -p /tmp/consumer/Sources/Consumer
          cd /tmp/consumer
          {
            echo '// swift-tools-version: 6.2'
            echo 'import PackageDescription'
            echo 'let package = Package('
            echo '    name: "Consumer",'
            echo '    platforms: [.macOS(.v26), .iOS(.v26)],'
            echo "    dependencies: [.package(path: \"$GITHUB_WORKSPACE/$NAME\")],"
            echo '    targets: [.executableTarget(name: "Consumer", dependencies: ['
            echo "        .product(name: \"$NAME\", package: \"$NAME\"),"
            echo "        .product(name: \"${NAME}3D\", package: \"$NAME\"),"
            echo "        .product(name: \"${NAME}JPIP\", package: \"$NAME\")])]"
            echo ')'
          } > Package.swift
          printf 'import %s\nimport %s3D\nimport %sJPIP\nprint("consumer built")\n' "$NAME" "$NAME" "$NAME" > Sources/Consumer/main.swift
          swift build
          swift run Consumer
          xcodebuild build \
            -scheme Consumer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/consumer-ios-derived-data \
            -clonedSourcePackagesDirPath /tmp/consumer-ios-source-packages \
            CODE_SIGNING_ALLOWED=NO
